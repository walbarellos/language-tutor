<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratório da língua</title>
<style>
:root{--bg:#fbfaf7;--fg:#1c1b19;--mut:#5d5a54;--card:#fff;--line:#d9d4c9;--acc:#8a4b00;--it:#b3261e;--pt:#1b5e9b}
@media (prefers-color-scheme:dark){:root{--bg:#16181d;--fg:#eceff4;--mut:#a7afbd;--card:#20242b;--line:#343a44;--acc:#f0b562;--it:#ff8f85;--pt:#86bff2}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,select,textarea,input{font:inherit;color:var(--fg)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:1rem;margin:0;flex:1}
.b{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:44px;min-width:44px}
.b[aria-pressed=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
main{overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px;align-content:start}
@media(min-width:900px){main{grid-template-columns:minmax(0,1fr) 320px}}
#page{max-width:46rem;margin:0 auto;width:100%}
.seg{border-left:4px solid var(--line);padding:6px 14px;margin:6px 0;border-radius:4px;font:calc(1.25rem*var(--fs,1))/1.95 Georgia,serif;opacity:.6;cursor:pointer;transition:opacity .2s}
.seg.it{border-color:var(--it)}.seg.pt{border-color:var(--pt);font-family:system-ui,sans-serif}
.seg.on{opacity:1;background:var(--card)}
.tag{font:700 .65rem system-ui;letter-spacing:.08em;color:var(--mut);display:block}
.w{background:none;border:0;padding:0 1px;margin:0;border-radius:6px;cursor:pointer;font:inherit;color:inherit}
.w:hover{background:var(--line)}
.has{text-decoration:underline dotted var(--acc);text-underline-offset:5px}
.w.now{background:color-mix(in srgb,var(--acc) 28%,transparent);box-shadow:inset 0 -3.5px 0 0 var(--acc)}
[data-m=hop] .w.now{animation:heavyHop 0.36s cubic-bezier(0.2,0.9,0.3,1.2)}
@keyframes heavyHop{
  0%{transform:scale(1,1) translateY(0)}
  25%{transform:scale(1.12,0.88) translateY(-4px)}
  55%{transform:scale(0.94,1.06) translateY(-6px)}
  80%{transform:scale(1.04,0.96) translateY(0)}
  100%{transform:scale(1,1) translateY(0)}
}
aside{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start;position:sticky;top:0}
aside h2{margin:0;font:1.6rem Georgia,serif}
.era{display:inline-block;background:var(--acc);color:var(--bg);border-radius:6px;padding:0 8px;font-size:.8rem;margin:4px 0}
@media(max-width:899px){aside{position:fixed;left:8px;right:8px;bottom:84px;z-index:5;box-shadow:0 6px 24px #0006}aside:empty{display:none}}
footer{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:10px 16px;border-top:1px solid var(--line);background:var(--card)}
#msg{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--it);color:#fff;border-radius:8px;padding:8px 14px;display:none;z-index:9}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--fg);width:min(560px,92vw)}
dialog label{display:block;margin:10px 0 2px;color:var(--mut);font-size:.85rem}dialog select,dialog textarea{width:100%;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:8px}
textarea{min-height:240px}
[data-listen=on] .seg.it:not(.rev) .w{filter:blur(7px);pointer-events:none}[data-listen=on] .seg.it:not(.rev) .tr{visibility:hidden}.rvb{display:none;float:right;min-height:32px;padding:2px 10px;font-size:.8rem}[data-listen=on] .seg.it .rvb{display:inline-block}
[data-freq=on] .w.f1{background:color-mix(in srgb,#2e9d57 24%,transparent)}[data-freq=on] .w.f2{background:color-mix(in srgb,#d9a21b 22%,transparent)}[data-freq=on] .w.now{background:color-mix(in srgb,var(--acc) 28%,transparent)}
rt{font:.5em/1.2 system-ui,sans-serif;color:var(--mut)}
dialog{max-height:85vh;overflow:auto}
.sitb{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:12px;background:var(--card)}.sitb h2{margin:0;font:1.3rem Georgia,serif}.sitb p{margin:.3em 0 .6em;color:var(--mut)}
.w.sh-ok{text-decoration:underline solid #2e9d57 3px;text-underline-offset:5px}.w.sh-mid{text-decoration:underline dashed #d9a21b 3px;text-underline-offset:5px}.w.sh-bad{text-decoration:underline wavy #e5484d 3px;text-underline-offset:5px}
.sh{font:.9rem system-ui,sans-serif;color:var(--mut);margin-top:8px;cursor:default}.sh .b{min-height:36px;padding:4px 12px}.seg[lang=ja]{line-height:2.6}
#rv .sent{font:1.4rem/1.8 Georgia,serif}mark{background:color-mix(in srgb,var(--acc) 35%,transparent);color:inherit;border-radius:4px;padding:0 2px}.grades{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grades .b{flex:1;min-width:90px}.grades small{display:block;color:var(--mut)}
.tr{display:none;font:.95rem/1.5 system-ui,sans-serif;color:var(--mut);margin-top:2px}.tr:empty::before{content:'…'}[data-tr=on] .tr{display:block}.tr::before{content:'≈ '}
.wk{margin-top:10px;font-size:.9rem;border-top:1px solid var(--line);padding-top:8px}.wk h3{margin:0 0 4px;font-size:.75rem;color:var(--mut);letter-spacing:.05em}.wk ol{margin:2px 0 8px;padding-left:1.2em}
</style>
</head>
<body data-m="hop" data-freq="on" data-read="furi">
<header><h1>Laboratório da língua</h1><button class="b" id="bTrl">Trilha</button><button class="b" id="bRev">Revisar (0)</button><button class="b" id="bImp">Texto</button><button class="b" id="bSet" aria-label="Configurações">⚙</button></header>
<main><div id="page" aria-live="off"></div><aside id="pw" aria-live="polite"></aside></main>
<footer role="toolbar" aria-label="Controles de leitura">
<button class="b" id="bPrev" aria-label="Frase anterior">‹</button>
<button class="b" id="bPlay" aria-label="Tocar ou pausar">▶</button>
<button class="b" id="bNext" aria-label="Próxima frase">›</button>
<label>Velocidade <select class="b" id="sp"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select></label>
<button class="b" id="bLoop" aria-pressed="false">Repetir</button>
<button class="b" id="bTr" aria-pressed="false">Tradução</button>
<button class="b" id="bFq" aria-pressed="true">Frequência</button>
<button class="b" id="bRd" hidden>Leitura: furigana</button>
<button class="b" id="bRec" aria-pressed="false">🎙 Gravar</button>
<button class="b" id="bEar" aria-pressed="false">Só ouvir</button>
<button class="b" id="bGap" aria-pressed="false">Pausa p/ repetir</button>
</footer>
<div id="msg" role="alert"></div>

<dialog id="dImp"><form method="dialog"><label for="tx">Cole um texto (português e italiano misturados). Use [it] ou [pt] no começo de uma frase para forçar o idioma.</label><textarea id="tx"></textarea><p><button class="b" value="ok">Estudar</button> <button class="b" value="x">Cancelar</button></p></form></dialog>
<dialog id="dTrl"><div id="trl"></div><p><button class="b" id="trlX">Fechar</button></p></dialog>
<dialog id="dRev"><div id="rv" aria-live="polite"></div><p><button class="b" id="rvX">Fechar</button></p></dialog>
<dialog id="dSet"><form method="dialog">
<label for="vpt">Voz do português</label><select id="vpt"><option value="pt-BR-FranciscaNeural">Francisca</option><option value="pt-BR-AntonioNeural">Antonio</option></select>
<label for="sl">Idioma de estudo (cole um texto novo depois de trocar)</label><select id="sl"></select>
<label for="vit">Voz do idioma de estudo</label><select id="vit"></select>
<label for="mo">Movimento da palavra</label><select id="mo"><option value="none">Nenhum</option><option value="soft">Suave (só cor)</option><option value="hop">Pulo</option></select>
<label for="fs">Tamanho do texto</label><input id="fs" type="range" min="0.9" max="1.8" step="0.1" value="1" style="width:100%">
<p><button class="b">Fechar</button></p></form></dialog>

<script>
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[^\p{L}]/gu,"");
const DEFAULT=`Nasce da questo una disputa: s’egli è melhor essere amato que temuto, o e converso.
Rispondo che si vorrebbe essere l’uno e l’altro; ma porque egli è difficile accozzarli insieme, è muito mais seguro essere temuto che amato, quando si abbia a mancare dell’uno de’ dua.`;
// Dicionário mínimo; no produto virá do Wiktionary + LLM. [forma moderna, época, sentido]
const DICT={sanza:["senza","arcaico","sem"],doppo:["dopo","arcaico","depois"],arebbe:["avrebbe","arcaico","teria"],egli:["egli","literário","ele"],
converso:["e converso","latinismo","e vice-versa"],dua:["due","florentino antigo","dois"],de:["dei","arcaico","contração de di + i (dos)"],
nasce:["nascere","moderno","nasce, surge: nasce da questo una disputa = daí surge uma disputa"],meglio:["meglio","moderno","melhor"],
accozzarli:["accozzare","raro","juntá-los, combiná-los à força"],mancare:["mancare","moderno","faltar; mancare dell’uno = ficar sem um dos dois"],
vorrebbe:["volere","moderno","condicional: gostaria; si vorrebbe = seria desejável"],temuto:["temere","moderno","temido"],amato:["amare","moderno","amado"],
sicuro:["sicuro","moderno","seguro"],principato:["principato","moderno","principado"],arme:["arma","moderno","armas"],disputa:["disputa","moderno","disputa, questão"]};

// ---------- Idiomas: contrato base + uma subclasse por língua ----------
class Language{
 constructor(code,voice){this.code=code;this.voice=voice}
 tokenize(text){ // Intl.Segmenter serve também para japonês (sem espaços)
  return [...new Intl.Segmenter(this.code,{granularity:"word"}).segment(text)].filter(s=>s.isWordLike).map(s=>({text:s.segment,start:s.index}))}
 annotate(t){return t}
}
class Italian extends Language{annotate(t){const e=DICT[norm(t.text)];if(e)Object.assign(t,{lemma:e[0],era:e[1],gloss:e[2]});return t}}
class Portuguese extends Language{}
class Japanese extends Language{get reads(){return true}}   // idiomas com leitura própria (furigana/romaji)
// Idiomas de estudo: para somar um idioma, basta uma linha aqui (código wordfreq/Intl, nome, vozes Azure; confirme com: edge-tts --list-voices)
const STUDYL={it:{n:"Italiano",v:[["it-IT-IsabellaNeural","Isabella"],["it-IT-ElsaNeural","Elsa"],["it-IT-DiegoNeural","Diego"]]},
 es:{n:"Español",v:[["es-ES-ElviraNeural","Elvira"],["es-ES-AlvaroNeural","Álvaro"]]},
 fr:{n:"Français",v:[["fr-FR-DeniseNeural","Denise"],["fr-FR-HenriNeural","Henri"]]},
 en:{n:"English",v:[["en-US-AriaNeural","Aria"],["en-US-GuyNeural","Guy"]]},
 de:{n:"Deutsch",v:[["de-DE-KatjaNeural","Katja"],["de-DE-ConradNeural","Conrad"]]},
 ja:{n:"日本語",v:[["ja-JP-NanamiNeural","Nanami"],["ja-JP-KeitaNeural","Keita"]]},
 he:{n:"עברית",v:[["he-IL-HilaNeural","Hila"],["he-IL-AvriNeural","Avri"]],rtl:1},
 ar:{n:"العربية",v:[["ar-SA-ZariyahNeural","Zariyah"],["ar-SA-HamedNeural","Hamed"]],rtl:1}};
let STUDY="it";
const LANGS={pt:new Portuguese("pt","pt-BR-FranciscaNeural")};
for(const c in STUDYL)LANGS[c]=new({it:Italian,ja:Japanese}[c]||Language)(c,STUDYL[c].v[0][0]);

// ---------- Pipeline: cada etapa recebe o documento e devolve o documento ----------
class Stage{async run(d){return d}}
class Split extends Stage{async run(d){d.segs=d.raw.split(/\n+/).flatMap(l=>l.split(/(?<=[.!?;:])\s+(?=[A-ZÀ-Ý"“\[])/)).map(s=>s.trim()).filter(Boolean).map(text=>({text}));return d}}
const IT=new Set("il lo gli che non per con una questo quello come più ma egli sanza senza doppo dopo essere amato temuto nasce da disputa meglio rispondo si vorrebbe perché difficile accozzarli insieme molto sicuro quando abbia mancare dua nessuno principato è proprie arme converso del della nel sono".split(" "));
const PT=new Set("o os as que não para com uma um isso este você como mais mas está sem então palavra significa forma antiga vamos ler trecho capítulo repare escreve em vez de erro época florentina do da no na dos das é melhor".split(" "));
class Detect extends Stage{async run(d){
 const auto=[];
 d.segs.forEach((s,i)=>{const m=s.text.match(/^\[([a-z]{2})\]\s*/i);   // [xx] no começo da frase força o idioma
  if(m&&LANGS[m[1].toLowerCase()]){s.lang=m[1].toLowerCase();s.text=s.text.slice(m[0].length)}
  else if(NONLATIN.has(STUDY)&&/[\u0590-\u06FF\u3040-\u30FF\u4E00-\u9FFF]/.test(s.text))s.lang=STUDY;   // escrita própria identifica o idioma sem consultar o servidor
  else auto.push(i)});
 if(auto.length){const tx=auto.map(i=>d.segs[i].text);let langs;
  try{const r=await fetch("/api/detect",{method:"POST",body:JSON.stringify({texts:tx,cands:["pt",STUDY]})});const j=await r.json();if(j.error)throw new Error(j.error);langs=j.langs}
  catch(e){if(/wordfreq/.test(e.message))warn(e);langs=this.fallback(tx)}
  auto.forEach((i,n)=>d.segs[i].lang=langs[n])}
 return d}
 fallback(texts){let prev="pt";return texts.map(t=>{   // sem wordfreq: escrita não latina = estudo; italiano usa listas de palavras
  if(/[^\u0000-\u024F\s\p{P}\d]/u.test(t))return prev=STUDY;
  if(STUDY!=="it")return prev="pt";
  let a=0,b=0;for(const w of(t.toLowerCase().match(/[\p{L}’']+/gu)||[]).map(x=>x.replace(/’/g,"'"))){IT.has(w)&&a++;PT.has(w)&&b++}
  if(/[ãõç]/i.test(t))b+=2;if(/[èòì]/.test(t))a+=2;
  return prev=a>b?"it":b>a?"pt":prev})}}
class Tokenize extends Stage{async run(d){d.segs.forEach(s=>s.tokens=LANGS[s.lang].tokenize(s.text));return d}}
class Annotate extends Stage{async run(d){d.segs.forEach(s=>s.tokens.forEach(t=>LANGS[s.lang].annotate(t)));return d}}
class Pipeline{constructor(...st){this.st=st}async run(d){for(const s of this.st)d=await s.run(d);return d}}
class Reading extends Stage{async run(d){const by={};
 d.segs.forEach(s=>{if(LANGS[s.lang].reads)s.tokens.forEach(t=>(by[s.lang]=by[s.lang]||new Set()).add(t.text))});
 for(const l in by){try{const r=await fetch("/api/reading",{method:"POST",body:JSON.stringify({words:[...by[l]]})}),j=await r.json();if(j.error)throw new Error(j.error);
  d.segs.forEach(s=>{if(s.lang===l)s.tokens.forEach(t=>Object.assign(t,j.reads[t.text]||{}))})}catch(e){warn(e)}}
 return d}}
const pipe=new Pipeline(new Split(),new Detect(),new Tokenize(),new Annotate(),new Reading());
const NONLATIN=new Set(["ja","he","ar"]);

// ---------- Voz + alinhamento (sob demanda, por frase) ----------
// Alinha pela POSIÇÃO no texto, não pela igualdade das palavras: funciona mesmo quando a voz e o segmentador dividem diferente (japonês)
function align(tokens,bw,text){let pos=0;for(const b of bw){const at=text.indexOf(b.text,pos);if(at<0)continue;pos=at+b.text.length;
 const t=tokens.find(x=>at>=x.start&&at<x.start+x.text.length)||tokens.find(x=>x.start>=at);if(t&&t.t0===undefined)Object.assign(t,{t0:b.t,t1:b.t+b.d})}}
async function ensure(seg){
 if(seg.audio)return seg;
 const r=await fetch("/tts",{method:"POST",body:JSON.stringify({text:seg.text,voice:LANGS[seg.lang].voice})});
 const j=await r.json();if(j.error)throw new Error(j.error);
 seg.audio=new Audio("data:audio/mpeg;base64,"+j.audio);seg.audio.preservesPitch=true;align(seg.tokens,j.words,seg.text);return seg}
function warn(e){const m=$("#msg");m.textContent=/fetch|NetworkError|Unexpected/i.test(e.message)?"Servidor local não responde. Rode leitor_local.py.":e.message;m.style.display="block";setTimeout(()=>m.style.display="none",5000)}

// ---------- Player ----------
let segs=[];const P={i:0,speed:1,loop:false,range:null,auto:false,k:-1,raf:0,token:0,gap:false,timer:0,waiting:false};
const cur=()=>segs[P.i]&&segs[P.i].audio;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function mark(seg,k){P.k=k;seg.tokens.forEach((t,n)=>t.el.classList.toggle("now",n===k))}
function tick(){const a=cur();if(!a||a.paused)return;
 const t=a.currentTime*1000,seg=segs[P.i];  // currentTime já está na linha do tempo do áudio: não muda com a velocidade
 let k=-1;seg.tokens.forEach((x,n)=>{if(x.t0!==undefined&&x.t0<=t)k=n});if(k!==P.k)mark(seg,k);
 if(P.range&&t>=P.range.t1){if(P.loop)a.currentTime=P.range.t0/1000;else{a.pause();$("#bPlay").textContent="▶";return}}
 P.raf=requestAnimationFrame(tick)}
function stop(){P.token++;clearTimeout(P.timer);P.waiting=false;cancelAnimationFrame(P.raf);const a=cur();if(a)a.pause();$("#bPlay").textContent="▶"}
async function play(i,range=null,auto=true){
 stop();const tk=P.token;
 try{const seg=await ensure(segs[i]);if(tk!==P.token)return;
  P.i=i;P.range=range;P.auto=auto&&!range;
  if(SIT&&!range){SIT.heard.add(i);if(SIT.heard.size===segs.length){(PROG[SIT.lang]=PROG[SIT.lang]||{})[SIT.id]=true;saveProg()}}   // situação concluída = ouviu todas as frases
  document.querySelectorAll(".seg").forEach((e,n)=>e.classList.toggle("on",n===i));
  const a=seg.audio;a.playbackRate=P.speed;a.currentTime=range?range.t0/1000:0;
  a.onended=()=>{mark(seg,-1);
   const go=()=>{if(tk!==P.token)return;if(P.loop&&!range)play(i,null,P.auto);else if(P.auto&&i+1<segs.length)play(i+1,null,true);else $("#bPlay").textContent="▶"};
   const w=P.gap&&!range&&P.auto?a.duration*1000/P.speed:0;   // pausa = tempo da própria frase, para você repetir em voz alta
   if(w){P.waiting=true;P.timer=setTimeout(()=>{P.waiting=false;go()},w)}else go()};
  await a.play();$("#bPlay").textContent="⏸";tick();
  seg.el.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"});
  if(segs[i+1])ensure(segs[i+1]).catch(()=>{})}  // já prepara a próxima: sem pausa entre frases
 catch(e){warn(e)}}
function toggle(){const a=cur();if(P.waiting||(a&&!a.paused)){stop()}else if(a&&a.currentTime>0&&!a.ended&&!P.range){a.play();$("#bPlay").textContent="⏸";tick()}else play(P.i)}
function word(seg,t){
 const p=$("#pw");p.innerHTML="";const h=document.createElement("h2");h.textContent=t.text;p.append(h);
 const d=document.createElement("div");
 if(t.era){const e=document.createElement("span");e.className="era";e.textContent=t.era;p.append(e);d.textContent="Forma moderna: "+t.lemma+". Sentido: "+t.gloss+"."}
 else d.textContent=seg.lang!=="pt"?"Sem entrada no dicionário do protótipo.":"Palavra em português.";
 p.append(d);
 if(seg.lang!=="pt")p.append(saveBtn(seg,t));if(seg.lang==="ja"&&t.hira)p.append(E("p","Leitura: "+t.hira+" ("+t.romaji+")"));
 if(seg.lang!=="pt"){if(t.rank!==undefined)p.append(E("p",t.rank?"Frequência: nº "+t.rank+(t.rank<=1000?" (essencial)":t.rank<=3000?" (alta frequência)":""):"Frequência: fora das 50 mil mais comuns"));
  cog(t.text,seg.lang).then(c=>{if(c.length)p.append(E("p","Parece com: "+c.map(z=>z.word+" ("+z.lang+")").join(", ")+". Pode ser falso amigo, confira."))}).catch(()=>{})}
 if(seg.lang!=="pt"){const box=document.createElement("div");box.className="wk";box.textContent="Buscando no Wiktionary…";p.append(box);wiki(t.text,seg.lang).then(r=>fill(box,r)).catch(()=>{box.textContent="Wiktionary indisponível agora (precisa de internet na primeira consulta)."})}
 if(t.t0!==undefined){const b=document.createElement("button");b.className="b";b.textContent="🔊 Ouvir de novo";b.onclick=()=>play(segs.indexOf(seg),{t0:t.t0,t1:t.t1},false);p.append(b);play(segs.indexOf(seg),{t0:t.t0,t1:t.t1},false)}
 else{ensure(seg).then(()=>word(seg,t)).catch(warn)}}   // 1º clique numa frase ainda sem áudio: gera e volta

// ---------- Tela ----------
function render(){
 const pg=$("#page");pg.innerHTML="";
 segs.forEach((s,i)=>{const el=document.createElement("div");el.className="seg "+(s.lang==="pt"?"pt":"it");el.dir=(STUDYL[s.lang]||{}).rtl?"rtl":"ltr";el.lang=s.lang;s.el=el;
  const tg=document.createElement("span");tg.className="tag";tg.textContent=s.who?s.who.toUpperCase():s.lang==="pt"?"PORTUGUÊS":(STUDYL[s.lang]||{n:s.lang}).n.toUpperCase();el.append(tg);const rb=document.createElement("button");rb.className="b rvb";rb.onclick=e=>{e.stopPropagation();s.rev=!s.rev;applyEar()};s.rvb=rb;if(s.lang!=="pt")el.append(rb);
  let pos=0;s.tokens.forEach(t=>{el.append(s.text.slice(pos,t.start));

// ---------- Guardar palavras + revisão espaçada ----------
// Scheduler é o contrato; SM2 é a 1ª implementação. FSRS entra depois como outra subclasse, sem mexer na tela.
class Scheduler{next(c,q){throw new Error("implementar")}}
class SM2 extends Scheduler{ // q: 0 errei, 1 difícil, 2 bom, 3 fácil
 next(c,q){let{ease=2.5,interval=0,reps=0}=c;   // 2.5 = facilidade inicial padrão do SuperMemo-2
  if(q===0){reps=0;interval=0;ease=Math.max(1.3,ease-.2)}   // 1.3 = piso do SM-2: abaixo disso os intervalos quase não crescem
  else{reps++;interval=reps===1?1:reps===2?6:Math.round(interval*ease*(q===1?.8:q===3?1.3:1));ease=Math.max(1.3,ease+(q===1?-.15:q===3?.15:0))}
  return{ease,interval,reps}}}
const SCH=new SM2();
let CARDS=[],Q=[],RV=false;
const E=(t,x,c)=>{const e=document.createElement(t);if(x)e.textContent=x;if(c)e.className=c;return e};

const count=()=>{$("#bRev").textContent="Revisar ("+dueList().length+")"};
const saveCards=()=>fetch("/api/cards",{method:"POST",body:JSON.stringify({cards:CARDS})}).then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error)}).catch(warn);
fetch("/api/cards").then(r=>r.json()).then(j=>{CARDS=j.cards||[];count()}).catch(()=>{});
function saveBtn(seg,t){const id=seg.lang+"|"+norm(t.text),b=E("button","","b");const on=()=>CARDS.some(c=>c.id===id);
 const paint=()=>{b.textContent=on()?"★ Guardada":"☆ Guardar para revisar";b.setAttribute("aria-pressed",on())};
 b.onclick=()=>{if(on())CARDS=CARDS.filter(c=>c.id!==id);else CARDS.push({id,lang:seg.lang,word:t.text,lemma:t.lemma||(t.kanji?t.hira:""),gloss:t.gloss||"",era:t.era||"",sentence:seg.text,start:t.start,due:Date.now(),interval:0,ease:2.5,reps:0});saveCards();paint();count()};
 paint();return b}

function rvShow(back){RV=back;const r=$("#rv");r.textContent="";
 if(!Q.length){r.append(E("p","Nada para revisar agora. Guarde palavras clicando nelas no texto."));const x=E("button","Exportar para o Anki (.tsv)","b");x.onclick=exportTsv;r.append(x);return}
 const c=Q[0];r.append(E("p",Q.length+" para revisar","tag"));
 const p=E("p","","sent");p.append(c.sentence.slice(0,c.start),E("mark",c.word),c.sentence.slice(c.start+c.word.length));r.append(p);
 const h=E("button","🔊 Ouvir a frase","b");h.onclick=()=>hear(c);r.append(h);
 if(!back){const m=E("button","Mostrar resposta","b");m.onclick=()=>rvShow(true);m.autofocus=true;r.append(" ",m);return}
 r.append(E("h2",c.lemma||c.word));if(c.era)r.append(E("span",c.era,"era"));r.append(E("p",c.gloss||"Sem sentido salvo: veja o dicionário no painel da palavra."));
 const g=E("div","","grades");["Errei","Difícil","Bom","Fácil"].forEach((nm,q)=>{const b=E("button",(q+1)+" "+nm,"b");b.append(E("small",fmt(SCH.next(c,q).interval)));b.onclick=()=>grade(q);g.append(b)});r.append(g);g.children[2].focus()}   // foco em "Bom", a resposta mais comum

// Faixas: até 1000 = essencial; até 3000 = alta frequência (Paul Nation: ~3000 palavras formam o núcleo de uso comum)
async function loadFreq(){const by={};
 segs.forEach(s=>{if(s.lang!=="pt")s.tokens.forEach(t=>(by[s.lang]=by[s.lang]||new Set()).add(t.text.toLowerCase()))});
 for(const l in by){try{
  const r=await fetch("/api/freq",{method:"POST",body:JSON.stringify({lang:l,words:[...by[l]]})}),j=await r.json();if(j.error)throw new Error(j.error);
  segs.forEach(s=>{if(s.lang!==l)return;s.tokens.forEach(t=>{const k=j.ranks[t.text.toLowerCase()]||0;t.rank=k;
   t.el.classList.toggle("f1",k>0&&k<=1000);t.el.classList.toggle("f2",k>1000&&k<=3000);t.el.title=k?"Frequência nº "+k:""})})}
 catch(e){if(/wordfreq/.test(e.message))warn(e);return}}}
const CG={};
function cog(w,l){if(!/^[\p{Script=Latin}'’-]+$/u.test(w))return Promise.resolve([]);const k=l+norm(w);
 return CG[k]||(CG[k]=fetch("/api/cognate?w="+encodeURIComponent(w)+"&lang="+l).then(r=>r.json()).then(j=>j.error?[]:j.similar).catch(()=>{delete CG[k];return[]}))}

// ---------- Shadowing: gravar a própria voz e comparar com o texto ----------
// O Whisper local transcreve o que você disse; comparar com o texto mede se você foi ENTENDIDO, não o sotaque. Para conversar, é isso que importa.
const REC={mr:null,chunks:[],timer:0};
async function startRec(){
 try{stop();const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const seg=segs[P.i],mr=new MediaRecorder(stream);REC.mr=mr;REC.chunks=[];
  mr.ondataavailable=e=>REC.chunks.push(e.data);
  mr.onstop=()=>{clearTimeout(REC.timer);stream.getTracks().forEach(t=>t.stop());analyze(seg,new Blob(REC.chunks,{type:mr.mimeType}))};
  mr.start();REC.timer=setTimeout(()=>mr.state==="recording"&&stopRec(),30000);   // 30 s: trava de segurança
  $("#bRec").setAttribute("aria-pressed",true);$("#bRec").textContent="⏹ Parar"}
 catch(e){warn(new Error(e.name==="NotAllowedError"?"Microfone bloqueado: libere nas permissões do navegador.":"Microfone indisponível: "+e.message))}}
function stopRec(){if(REC.mr&&REC.mr.state==="recording")REC.mr.stop();$("#bRec").setAttribute("aria-pressed",false);$("#bRec").textContent="🎙 Gravar"}
$("#bRec").onclick=()=>$("#bRec").getAttribute("aria-pressed")==="true"?stopRec():startRec();
function resBox(seg){if(!seg.sh){seg.sh=E("div","","sh");seg.sh.onclick=e=>e.stopPropagation();seg.el.append(seg.sh)}seg.sh.textContent="";return seg.sh}
async function analyze(seg,blob){
 seg.mine=URL.createObjectURL(blob);resBox(seg).append("Analisando… (na 1ª vez o modelo é baixado, ~500 MB)");
 let text="",res=null;
 try{const r=await fetch("/api/asr?lang="+seg.lang,{method:"POST",body:blob}),j=await r.json();if(j.error)throw new Error(j.error);text=j.text.trim();res=text?await score(seg,text):null}
 catch(e){warn(e)}
 const b=resBox(seg);
 b.append(E("div",res?"Acerto: "+res.pct+"%  ·  Entendi: “"+text+"”":text?"Entendi: “"+text+"”":"Não entendi nada. Tente de novo, mais perto do microfone."));
 const o=E("button","🔊 Original","b");o.onclick=()=>{stop();ensure(seg).then(s=>{s.audio.currentTime=0;s.audio.playbackRate=P.speed;s.audio.play()}).catch(warn)};
 const m=E("button","▶ Minha voz","b");m.onclick=()=>{stop();new Audio(seg.mine).play()};
 b.append(o," ",m)}
// Compara letra por letra (distância de edição): funciona sem espaços (japonês) e tolera pequenas variações de grafia da transcrição.
async function score(seg,text){const ja=seg.lang==="ja";
 const nk=s=>(ja?s:s.normalize("NFD").replace(/\p{M}/gu,"")).toLowerCase().replace(/[^\p{L}\p{N}]/gu,"");   // japonês mantém o dakuten (か ≠ が)
 let rec=text;
 if(ja){try{const r=await fetch("/api/reading",{method:"POST",body:JSON.stringify({words:[text]})}),j=await r.json();rec=j.reads[text].hira}catch(e){}}   // compara em hiragana: kanji vs kana não conta como erro
 const T=[],own=[];seg.tokens.forEach((t,i)=>{for(const c of nk(ja&&t.hira?t.hira:t.text)){T.push(c);own.push(i)}});
 const R=[...nk(rec)];if(!T.length)return null;
 const n=T.length,m=R.length,D=Array.from({length:n+1},(_,i)=>{const r=new Int32Array(m+1);r[0]=i;return r});
 for(let j=1;j<=m;j++)D[0][j]=j;
 for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(T[i-1]===R[j-1]?0:1));
 const ok=new Array(n).fill(false);let i=n,j=m;
 while(i>0&&j>0){const eq=T[i-1]===R[j-1];
  if(D[i][j]===D[i-1][j-1]+(eq?0:1)){if(eq)ok[i-1]=true;i--;j--}else if(D[i][j]===D[i-1][j]+1)i--;else j--}
 const hit=new Array(seg.tokens.length).fill(0),tot=new Array(seg.tokens.length).fill(0);
 own.forEach((o,k)=>{tot[o]++;if(ok[k])hit[o]++});
 // 85%: tolera 1 letra errada em palavras de 7+ letras (ruído da transcrição); abaixo de 50% a palavra não foi entendida
 seg.tokens.forEach((t,k)=>{t.el.classList.remove("sh-ok","sh-mid","sh-bad");if(!tot[k])return;const f=hit[k]/tot[k];
  t.el.classList.add(f>=.85?"sh-ok":f>=.5?"sh-mid":"sh-bad");t.el.title=Math.round(f*100)+"% reconhecido"});
 return{pct:Math.round(100*ok.filter(Boolean).length/n)}}
// ---------- Trilha por situação: cenas curtas do dia a dia, em frases completas ----------
// Dados em trilhas/<idioma>.json (com tradução revisada à mão). Para somar um idioma ou uma cena, edite o arquivo; não há código a mudar.
let SIT=null,PROG={};
fetch("/api/progress").then(r=>r.json()).then(j=>{PROG=j.progress||{}}).catch(()=>{});

  if(!j.situacoes.length){box.append(E("p","Ainda não há trilha para este idioma. Crie trilhas/"+STUDY+".json usando it.json como modelo."));return}

   const sm=E("small",s.objetivo+" · "+s.linhas.length+" frases");sm.style.display="block";b.append(sm);b.onclick=()=>{$("#dTrl").close();loadSit(s)};box.append(b)})}
 catch(e){box.textContent="";warn(e)}}
async function loadSit(s){stop();SIT={id:s.id,titulo:s.titulo,objetivo:s.objetivo,lang:STUDY,heard:new Set()};
 const d=await new Pipeline(new Tokenize(),new Annotate(),new Reading()).run({segs:s.linhas.map(l=>({text:l.t,lang:STUDY,tr:l.p,who:l.q}))});   // pula Split/Detect: as frases já vêm prontas
 segs=d.segs;render();applyRead();applyEar();loadFreq();
 const b=E("div","","sitb");b.append(E("h2",SIT.titulo),E("p",SIT.objetivo+" Ative “Tradução” para ver o português."));
 const k=E("button","★ Guardar todas as frases","b");
 k.onclick=()=>{let n=0;segs.forEach(g=>{const id="frase|"+g.lang+"|"+norm(g.text);if(CARDS.some(c=>c.id===id))return;n++;
  CARDS.push({id,lang:g.lang,word:g.text,lemma:"",gloss:g.tr||"",era:"",sentence:g.text,start:0,due:Date.now(),interval:0,ease:2.5,reps:0})});
  saveCards();count();k.textContent="★ "+n+" frases guardadas"};
 const nx=E("button","Outras situações","b");nx.onclick=openTrail;b.append(k," ",nx);$("#page").prepend(b)}
$("#bTrl").onclick=openTrail;$("#trlX").onclick=()=>$("#dTrl").close();
